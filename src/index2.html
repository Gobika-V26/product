<!DOCTYPE html>
<html>
<head>
    <title>Travel Buddy Finder</title>
</head>

<body>

    <h1>Travel Buddy Finder</h1>

    <form action="/travellers" method="POST">

        <label>Traveller ID:</label>
        <input type="text" name="travellerId" required>
        <br><br>

        <label>Name:</label>
        <input type="text" name="name" required>
        <br><br>

        <label>Destination:</label>
        <input type="text" name="destination" required>
        <br><br>

        <label>Travel Date:</label>
        <input type="date" name="travelDate" required>
        <br><br>

        <label>Budget:</label>
        <input type="number" name="budget" required>
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" required>
        <br><br>

        <button type="submit">Add Traveller</button>

    </form>

</body>
</html>
